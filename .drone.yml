kind: pipeline
type: docker
name: version-8

trigger:
  branch:
    - '8'
  event:
    - pull_request

# Build the docker image for the major version branch
steps:
  - name: v8-docker-image-build
    image: plugins/docker
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: kernel528/redis
      tags:
        - 'pr-${DRONE_PULL_REQUEST}-build-${DRONE_BUILD_NUMBER}'
      dry_run: true

  # Slack notification
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts
---

kind: pipeline
type: docker
name: main

trigger:
  event:
    - tag

# Build the docker image for the main branch & tagged release
steps:
  - name: main-docker-image-build
    image: plugins/docker
    when:
      event:
        - tag
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: kernel528/redis
      tags:
        - ${DRONE_TAG}
        - latest

  # Slack notification
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts
